[custom]
; Grepoch rules for subconverter / CF-Workers-SUB.
; 规则数据来自 Grepoch/rules release 分支。
; 这里使用 .txt 规则源，适合 subconverter 读取并生成 Clash/Mihomo 配置。

enable_rule_generator=true
overwrite_original_rules=true

; ===== 策略组 =====
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇩🇪 德国节点`[]🇺🇲 美国节点`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=☑️ 手动切换`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🤖 AI服务`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT
custom_proxy_group=📱 社交媒体`select`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=💾 网盘下载`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=🔍 Google`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT
custom_proxy_group=▶️ YouTube`select`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🎬 流媒体`select`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🎵 Spotify`select`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🎮 Steam`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT
custom_proxy_group=💻 Microsoft`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT
custom_proxy_group=📦 GitHub`select`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=☁️ Cloudflare`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=💰 PayPal`select`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🪙 Crypto`select`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🧱 代理服务`select`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🇨🇳 国内服务`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT

; ===== 规则源 =====
; 顺序很重要：更具体的规则放在更宽泛的大类之前。
; GoogleDrive / CloudDrive / Download 必须位于 Google 之前。

ruleset=REJECT,https://cdn.jsdelivr.net/gh/Grepoch/rules@release/mihomo/Reject/Reject-Site.txt
